# Keeps the site's video list and view counts in sync with the YouTube channel.
# Writes videos.json to the `data` branch; index.html reads it from there, so
# main's history stays clean and the site never needs a rebuild.
name: Update videos

on:
  schedule:
    - cron: '*/15 * * * *'   # GitHub runs this roughly every 15 minutes
  workflow_dispatch:
  push:
    branches: [main, claude/live-youtube-videos]
    paths: [scripts/update_videos.py, .github/workflows/update-videos.yml]

permissions:
  contents: write
  actions: write

concurrency:
  group: update-videos
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install --quiet --upgrade yt-dlp

      - name: Check out the data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add data origin/data
          else
            git worktree add --detach data
            git -C data checkout --orphan data
            git -C data rm -rfq .
          fi

      - name: Fetch videos from YouTube
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python scripts/update_videos.py data/videos.json

      - name: Publish
        working-directory: data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add videos.json
          # replace the single commit each time so the branch never grows
          git commit --quiet --amend -m 'Update videos.json' 2>/dev/null || git commit --quiet -m 'Update videos.json'
          git push --force origin HEAD:refs/heads/data

      # GitHub pauses scheduled workflows after 60 days without repo activity;
      # re-enabling on every run resets that clock.
      - name: Keep schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update-videos.yml/enable"
